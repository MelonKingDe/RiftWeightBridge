name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write # nötig, damit der Release-Schritt Dateien anhängen darf
    steps:
      - uses: actions/checkout@v4

      - name: Gradle-Wrapper prüfen
        uses: gradle/actions/wrapper-validation@v4

      - name: JDK 25 einrichten
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - name: Gradle einrichten (mit Cache)
        uses: gradle/actions/setup-gradle@v4

      - name: Bauen
        run: ./gradlew build --no-daemon

      - name: Mod-Jar einsammeln (ohne Sources-Jar)
        run: |
          mkdir dist
          cp $(ls build/libs/*.jar | grep -v -- '-sources') dist/

      - name: Jar als Artifact hochladen
        uses: actions/upload-artifact@v4
        with:
          name: riftweight-mod
          path: dist/*.jar

      # Nur bei Tags wie v1.0.0: GitHub Release mit der Jar erstellen
      - name: Release erstellen
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.jar
          generate_release_notes: true
